<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Theatrics, Boneifed inc.</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,700;6..96,900&family=Old+Standard+TT:ital,wght@0,400;0,700;1,400&family=IBM+Plex+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
  :root{
    --cream:#f2ede0; --ink:#1d1a15; --dim:#6d675c;
    --term:#15110b; --amber:#e8a33d; --amber-dim:#8f6627; --amber-faint:#3a2c16;
    --sheet:#d6cdb9; --alert:#d0583c;
    --serif-d:'Bodoni Moda', Didot, 'Times New Roman', serif;
    --serif:'Old Standard TT', Georgia, 'Times New Roman', serif;
    --mono:'IBM Plex Mono', ui-monospace, Menlo, Consolas, monospace;
  }
  *{ box-sizing:border-box; }
  html{ -webkit-text-size-adjust:100%; }
  body{ margin:0; background:var(--cream); color:var(--ink); font-family:var(--serif);
        padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px); }
  a{ color:inherit; }
  :focus-visible{ outline:2px solid var(--amber); outline-offset:2px; }

  /* ---------------- public site (TBI brand) ---------------- */
  .site{ max-width:720px; margin:0 auto; padding:22px 20px 40px; }
  .mast{ border-top:4px solid var(--ink); border-bottom:1.5px solid var(--ink); margin-bottom:6px;
         display:flex; justify-content:space-between; padding:6px 0 5px; font-size:13px; }
  .brand{ font-family:var(--serif-d); font-weight:900; font-size:clamp(34px,9vw,64px); line-height:.95;
          margin:18px 0 0; letter-spacing:-.5px; transform:scaleX(.9); transform-origin:left; }
  .site .tag{ font-family:var(--serif-d); font-size:clamp(28px,7.4vw,42px); line-height:1.08; margin:14px 0 26px; }
  .site h2{ font-family:var(--serif-d); font-weight:700; font-size:22px; margin:30px 0 8px;
            border-top:1.5px solid var(--ink); padding-top:12px; }
  .site p{ font-size:17px; line-height:1.55; margin:0 0 12px; max-width:62ch; }
  .news{ list-style:none; padding:0; margin:0; }
  .news li{ display:flex; gap:14px; padding:9px 0; border-bottom:1px solid rgba(29,26,21,.18); font-size:16px; }
  .news .d{ color:var(--dim); white-space:nowrap; min-width:7.5em; }
  .eotw{ background:var(--ink); color:var(--cream); padding:16px 18px; margin-top:8px; }
  .eotw p{ color:var(--cream); margin:0 0 6px; }
  .eotw .name{ font-family:var(--serif-d); font-weight:900; font-size:24px; }
  footer.site-foot{ margin-top:40px; padding-top:10px; border-top:1.5px solid var(--ink);
       display:flex; justify-content:space-between; font-size:12px; color:var(--dim); }
  footer.site-foot a{ color:var(--dim); text-decoration:none; }

  /* ---------------- portal (maintenance terminal) ---------------- */
  body.portal{ background:var(--term); color:var(--amber); font-family:var(--mono); }
  .term{ max-width:680px; margin:0 auto; padding:16px 16px 60px; }
  .bar{ display:flex; justify-content:space-between; align-items:center; gap:10px;
        border-bottom:1px solid var(--amber-dim); padding-bottom:10px; font-size:13px; }
  .bar .who{ font-weight:600; }
  .bar button, .linkbtn{ background:none; border:0; color:var(--amber-dim); font:inherit; font-size:13px;
        cursor:pointer; padding:6px 0; text-decoration:underline; }
  .logo{ cursor:default; user-select:none; }
  .progress{ margin:12px 0 4px; font-size:13px; color:var(--amber-dim); }
  .ticks{ display:flex; gap:3px; margin-top:6px; }
  .ticks i{ flex:1; height:6px; background:var(--amber-faint); }
  .ticks i.on{ background:var(--amber); }

  .entry{ margin:16px 0 18px; }
  .entry label{ display:block; font-size:13px; color:var(--amber-dim); margin-bottom:6px; }
  .row{ display:flex; gap:8px; }
  .term input[type=text]{ flex:1; min-width:0; background:#0c0a06; border:1.5px solid var(--amber-dim);
        color:var(--amber); font-family:var(--mono); font-size:22px; letter-spacing:4px;
        padding:12px 12px; text-transform:uppercase; border-radius:0; }
  .term input[type=text]::placeholder{ color:var(--amber-faint); letter-spacing:2px; }
  .btn{ background:var(--amber); color:var(--term); border:0; font-family:var(--mono); font-weight:600;
        font-size:16px; padding:0 18px; min-height:52px; cursor:pointer; border-radius:0; }
  .btn:disabled{ opacity:.45; cursor:wait; }
  .msg{ min-height:20px; margin-top:8px; font-size:14px; line-height:1.45; }
  .msg.bad{ color:var(--alert); }

  /* TBI paper: dimmed so it doesn't blind anyone outdoors at night */
  .sheet{ background:var(--sheet); color:var(--ink); padding:20px 20px 22px; margin-top:8px; }
  .sheet .lh{ display:flex; justify-content:space-between; gap:10px; border-bottom:2px solid var(--ink);
              padding-bottom:6px; font-family:var(--serif); font-size:12px; }
  .sheet .lh b{ font-family:var(--serif-d); font-weight:900; font-size:15px; }
  .sheet .stamp{ display:inline-block; border:1.5px solid #8e1b1b; color:#8e1b1b; font-family:var(--serif);
              font-size:11px; padding:2px 6px; margin:12px 0 6px; transform:rotate(-1.5deg); }
  .sheet h3{ font-family:var(--serif-d); font-weight:700; font-size:23px; line-height:1.2; margin:4px 0 12px; }
  .sheet p{ font-family:var(--serif); font-size:17px; line-height:1.55; margin:0 0 11px; }
  .sheet .small{ font-size:14px; color:#4a443a; }
  .sheet .pitch{ font-family:var(--serif-d); font-size:19px; font-weight:700; }
  .sheet .fourteen{ font-family:var(--serif-d); font-size:21px; line-height:1.35; font-style:italic; }
  .sheet table.log{ width:100%; border-collapse:collapse; margin:4px 0 12px; font-family:var(--serif); font-size:15px; }
  .sheet table.log td{ padding:6px 8px 6px 0; vertical-align:top; border-bottom:1px solid rgba(29,26,21,.2); line-height:1.4; }
  .sheet table.log td:first-child{ white-space:nowrap; font-weight:700; width:1%; }
  .redact{ background:var(--ink); color:var(--ink); letter-spacing:-2px; user-select:none; }

  /* Anders's voice: the terminal, under TBI's paper */
  .note{ margin-top:0; padding:14px 16px 16px; border:1px solid var(--amber-dim); border-top:0;
         font-size:15px; line-height:1.6; color:var(--amber); }
  .note .from{ font-size:12px; color:var(--amber-dim); margin-bottom:4px; }
  .note.reveal{ border-color:var(--amber); background:#1d160b; }

  .index{ margin-top:30px; }
  .index h4{ font-size:13px; font-weight:400; color:var(--amber-dim); margin:0 0 6px; }
  .files{ list-style:none; padding:0; margin:0; }
  .files li button{ width:100%; text-align:left; background:none; border:0; border-bottom:1px solid var(--amber-faint);
        color:var(--amber); font-family:var(--mono); font-size:14px; padding:11px 0; cursor:pointer; display:flex; gap:12px; }
  .files li button.locked{ color:var(--amber-faint); cursor:default; }
  .files li button.current{ font-weight:600; }
  .files .n{ min-width:2.4em; }

  .login{ max-width:420px; margin:12vh auto 0; }
  .login h1{ font-size:18px; font-weight:600; margin:0 0 4px; }
  .login .sub{ font-size:13px; color:var(--amber-dim); margin:0 0 22px; }
  .field{ margin-bottom:14px; }
  .field label{ display:block; font-size:13px; color:var(--amber-dim); margin-bottom:6px; }
  .field input{ width:100%; }
  .fine{ font-size:12px; color:var(--amber-faint); margin-top:26px; }

  .report{ margin-top:22px; border:1.5px solid var(--amber); padding:16px; }
  .report h3{ font-size:16px; margin:0 0 4px; }
  .report .sub{ font-size:13px; color:var(--amber-dim); margin:0 0 14px; line-height:1.5; }
  .q{ margin-bottom:16px; }
  .q .p{ font-weight:600; margin-bottom:6px; }
  .q label{ display:flex; gap:10px; align-items:flex-start; padding:8px 0; font-size:15px; line-height:1.4; cursor:pointer; }
  .q input{ margin-top:3px; accent-color:var(--amber); width:18px; height:18px; flex:none; }


  #maint{ position:fixed; inset:0; z-index:50; background:rgba(8,6,3,.88); display:flex; align-items:flex-start;
          justify-content:center; overflow-y:auto; padding:calc(env(safe-area-inset-top,0px) + 16px) 14px 30px;
          font-family:var(--mono); color:var(--amber); }
  #maint .mbox{ width:100%; max-width:440px; border:1px dashed var(--amber); background:var(--term); padding:16px; }
  #maint .mhead{ font-weight:600; font-size:15px; }
  #maint .msub{ font-size:12px; color:var(--amber-dim); margin:4px 0 14px; }
  #maint label{ display:block; font-size:13px; color:var(--amber-dim); margin-bottom:6px; }
  #maint input{ flex:1; min-width:0; background:#0c0a06; border:1.5px solid var(--amber-dim); color:var(--amber);
          font-family:var(--mono); font-size:17px; letter-spacing:2px; padding:11px; text-transform:uppercase; border-radius:0; }
  #maint p{ font-size:14px; line-height:1.5; margin:0 0 10px; }
  #maint .mgrid{ display:grid; grid-template-columns:1fr 1fr; gap:8px; margin-bottom:10px; }
  #maint .mgrid .btn{ font-size:14px; min-height:48px; padding:0 8px; }
  #maint .mans{ font-size:13px; color:var(--amber-dim); }
  #maint .mfoot{ display:flex; justify-content:space-between; margin-top:12px; border-top:1px solid var(--amber-faint); padding-top:8px; }
  .note.puz p{ margin:0 0 10px; }
  .note.puz .pq{ color:var(--amber); font-weight:600; }
  .note.puz .hint{ margin-top:10px; color:var(--amber-dim); font-size:13px; }
  .scramble{ font-variant-ligatures:none; }
  @media (prefers-reduced-motion: reduce){ *{ animation:none !important; transition:none !important; } }
</style>
</head>

      for(const t of Object.keys(TBI.teams)){ if(await signIn(t, acc)) return; }
      b.disabled = false; m.className = 'msg bad'; m.textContent = 'Access denied. Check the access code on your briefing card.';
    });
  }

  async function signIn(team, access){
    const s = await unseal(await derive(access, TBI.teams[team].salt), TBI.teams[team].session);
    if(!s) return false;
    session = { team, name:s.name, orientation:s.orientation };
    LS.set('session', session);
    files = LS.get(team + ':files', {});
    justOpened = 0;
    renderPortal(0);
    return true;
  }

  function fileById(id){ return id === 0 ? session.orientation : files[id]; }

  function renderPortal(showId){
    viewing = showId;
    const total = TBI.files, got = Object.keys(files).length;
    const f = fileById(showId);
    const rs = reportState();
    const finalOpen = !!files[total];
    let ticks = ''; for(let i = 1; i <= total; i++) ticks += `<i class="${files[i] ? 'on' : ''}"></i>`;

    let list = `<li><button data-id="0" class="${showId === 0 ? 'current' : ''}"><span class="n">00</span>Orientation</button></li>`;
    for(let i = 1; i <= total; i++){
      const n = String(i).padStart(2, '0');
      list += files[i]
        ? `<li><button data-id="${i}" class="${showId === i ? 'current' : ''}"><span class="n">${n}</span>${stripTags(files[i].title)}</button></li>`
        : `<li><button class="locked" disabled><span class="n">${n}</span>Locked</button></li>`;
    }

    app.innerHTML = `
    <div class="term">
      <div class="bar"><span class="who"><span class="logo">TBI</span> &nbsp;MAINT-04 &nbsp;/ &nbsp;${esc(session.name)}</span>
        <button id="so">Sign out</button></div>
      <div class="progress">Files recovered: ${got} of ${total}<div class="ticks">${ticks}</div></div>
      ${rs.solved ? '' : `
      <form class="entry" id="ef" autocomplete="off">
        <label for="code">File code</label>
        <div class="row"><input type="text" id="code" autocapitalize="characters" spellcheck="false" placeholder="6 characters">
          <button class="btn" id="eb" type="submit">Open</button></div>
        <div class="msg" id="em"></div>
      </form>`}
      <div id="doc">${renderDoc(f)}</div>
      ${finalOpen && !rs.solved ? renderReport(rs) : ''}
      ${rs.solved ? renderEnding(rs) : ''}
      <div class="index"><h4>Files</h4><ul class="files">${list}</ul></div>
    </div>`;

    wireReset();
    document.getElementById('so').onclick = () => {
      if(!confirm('Sign out on this phone? Recovered files stay saved.')) return;
      LS.set('session', null); session = null; viewing = null; renderLogin();
    };
    app.querySelectorAll('.files button[data-id]').forEach(b => b.onclick = () => {
      renderPortal(Number(b.dataset.id)); document.getElementById('doc').scrollIntoView({ behavior:'smooth' });
    });
    const ef = document.getElementById('ef');
    if(ef) ef.addEventListener('submit', e => { e.preventDefault(); openCode(document.getElementById('code').value); });
    const rf = document.getElementById('rf');
    if(rf) rf.addEventListener('submit', e => { e.preventDefault(); fileReport(); });
    const pf = document.getElementById('pf');
    if(pf) pf.addEventListener('submit', e => { e.preventDefault(); submitPuzzle(showId); });
    if(rs.lockUntil > Date.now()) tickLock();
    if(justOpened === showId && !reduceMotion) scrambleTitle();
    justOpened = null;
  }

  // ---------------- puzzles: the next directions stay locked until the answer is right ----------------
  function solvedMap(){ return LS.get(session.team + ':solved', {}); }
  function attemptsFor(id){ return (LS.get(session.team + ':att', {}))[id] || 0; }
  function noteHtml(text, reveal){
    return `<div class="note${reveal ? ' reveal' : ''}"><div class="from">MAINT-04:</div>${text}</div>`;
  }
  function noteBlock(f){
    if(!f.puzzle) return noteHtml(f.note, f.reveal);
    const sv = solvedMap()[f.id];
    if(sv) return noteHtml(sv, f.reveal);
    const hint = attemptsFor(f.id) >= 2 ? `<div class="hint">Hint: ${f.puzzle.hint}</div>` : '';
    return `<div class="note puz"><div class="from">MAINT-04:</div>
      <p>Before I tell you where to go next, one question.</p>
      <p class="pq">${f.puzzle.q}</p>
      <form id="pf" autocomplete="off"><div class="row"><input type="text" id="pa" autocapitalize="characters" spellcheck="false" placeholder="your answer"><button class="btn" id="pb" type="submit">Answer</button></div></form>
      <div class="msg" id="pm"></div>${hint}</div>`;
  }
  async function trySolve(id, answer){
    const f = files[id]; if(!f || !f.puzzle) return false;
    const key = await derive('PZ' + norm(answer), f.puzzle.salt);
    for(const blob of f.puzzle.sealed){
      const pt = await unseal(key, blob);
      if(pt){ const sv = solvedMap(); sv[id] = pt.note; LS.set(session.team + ':solved', sv); return true; }
    }
    return false;
  }
  async function submitPuzzle(id){
    const inp = document.getElementById('pa'), b = document.getElementById('pb'), m = document.getElementById('pm');
    const ans = norm(inp.value);
    if(!ans){ m.className = 'msg bad'; m.textContent = 'Type an answer first.'; return; }
    b.disabled = true; m.className = 'msg'; m.textContent = 'Checking...';
    if(await trySolve(id, ans)){ renderPortal(id); return; }
    const att = LS.get(session.team + ':att', {}); att[id] = (att[id] || 0) + 1; LS.set(session.team + ':att', att);
    renderPortal(id);
    const m2 = document.getElementById('pm'); if(m2){ m2.className = 'msg bad'; m2.textContent = "That's not it. Check the paper in your hands."; }
  }

  function renderDoc(f){
    if(!f) return '';
    return `
    <div class="sheet">
      <div class="lh"><b>TBI</b><span>${f.id === 0 ? 'Not on letterhead' : 'Theatrics, Boneifed inc. &mdash; internal'}</span><span>File ${f.no}</span></div>
      <div class="stamp">${f.cls}</div>
      <h3 class="scramble" id="dt">${f.title}</h3>
      ${f.body}
    </div>
    ${noteBlock(f)}`;
  }

  // The single unlock path. Players and the host panel both go through real decryption.
  async function tryUnlock(c){
    const key = await derive(c, teamData().salt);
    for(const blob of teamData().files){
      const pt = await unseal(key, blob);
      if(!pt) continue;
      if(files[pt.id]) return { status:'already', file:pt };
      files[pt.id] = pt; LS.set(session.team + ':files', files);
      return { status:'new', file:pt };
    }
    return { status:'none' };
  }

  async function openCode(raw){
    const m = document.getElementById('em'), b = document.getElementById('eb');
    const c = norm(raw);
    if(c.length < 6){ m.className = 'msg bad'; m.textContent = 'File codes are six letters and numbers.'; return; }
    b.disabled = true; m.className = 'msg'; m.textContent = 'Decrypting\u2026';
    const r = await tryUnlock(c);
    b.disabled = false;
    if(r.status === 'already'){                 // render first -- re-rendering would wipe the message
      renderPortal(r.file.id);
      const m2 = document.getElementById('em');
      if(m2){ m2.className = 'msg'; m2.textContent = 'Already recovered \u2014 showing it again.'; }
      return;
    }
    if(r.status === 'new'){
      justOpened = r.file.id;
      renderPortal(r.file.id);
      document.getElementById('doc').scrollIntoView({ behavior:'smooth' });
      return;
    }
    m.className = 'msg bad';
    m.textContent = 'No file matches that code. Check for a misread character, or make sure it\u2019s your team\u2019s envelope.';
  }

  // ---------------- the incident report ----------------
  function renderReport(rs){
    const qs = files[TBI.files].questions.map((q, i) => `
      <div class="q"><div class="p">${i + 1}. ${q.p}</div>
        ${q.o.map((o, j) => `<label><input type="radio" name="q${i}" value="${'ABCDE'[j]}">${o}</label>`).join('')}
      </div>`).join('');
    return `
    <form class="report" id="rf">
      <h3>Incident report 04</h3>
      <p class="sub">Answer all four. A rejected report locks the form for two minutes.</p>
      ${qs}
      <button class="btn" id="rb" type="submit" style="width:100%">File report</button>
      <div class="msg" id="rm">${rs.lastResult != null && rs.lockUntil <= Date.now() ? 'Last report rejected: ' + rs.lastResult + ' of 4 findings accepted.' : ''}</div>
    </form>`;
  }

  async function fileReport(){
    const rs = reportState(), m = document.getElementById('rm'), b = document.getElementById('rb');
    if(rs.lockUntil > Date.now()) return;
    const picks = files[TBI.files].questions.map((_, i) => {
      const r = document.querySelector(`input[name=q${i}]:checked`); return r ? r.value : null; });
    if(picks.includes(null)){ m.className = 'msg bad'; m.textContent = 'Answer all four before filing.'; return; }
    b.disabled = true; m.className = 'msg'; m.textContent = 'Filing\u2026';
    let correct = 0;
    for(let i = 0; i < picks.length; i++){
      if(await unseal(await derive('Q' + (i + 1) + picks[i], TBI.report.salt), TBI.report.markers[i])) correct++;
    }
    if(correct === picks.length){
      const ending = await unseal(await derive('ENDING' + picks.join(''), TBI.report.salt), TBI.report.ending);
      LS.set(session.team + ':report', { solved:true, solvedAt:Date.now(), ending, lockUntil:0 });
      renderPortal(viewing);
      document.getElementById('ending').scrollIntoView({ behavior:'smooth' });
      return;
    }
    LS.set(session.team + ':report', { solved:false, lockUntil:Date.now() + LOCK_MS, lastResult:correct });
    b.disabled = true;
    m.className = 'msg bad';
    m.textContent = `Report rejected. ${correct} of 4 findings accepted. TBI thanks you for your cooperation.`;
    tickLock();
  }

  function tickLock(){
    const b = document.getElementById('rb'), m = document.getElementById('rm');
    if(!b) return;
    const rs = reportState();
    const left = rs.lockUntil - Date.now();
    if(left <= 0){ b.disabled = false; b.textContent = 'File report'; return; }
    b.disabled = true;
    const s = Math.ceil(left / 1000);
    b.textContent = `Refile in ${Math.floor(s / 60)}:${String(s % 60).padStart(2, '0')}`;
    if(m && !m.textContent) m.textContent = `Last report rejected: ${rs.lastResult} of 4 findings accepted.`;
    setTimeout(tickLock, 1000);
  }

  function renderEnding(rs){
    const t = new Date(rs.solvedAt);
    const when = t.toLocaleTimeString([], { hour:'numeric', minute:'2-digit' });
    return `
    <div id="ending" style="margin-top:22px">
      <div class="sheet">
        <div class="lh"><b>TBI</b><span>Incident report 04</span><span>Accepted</span></div>
        <div class="stamp">ACCEPTED</div>
        ${rs.ending.body}
        <p style="text-align:right;margin:0">${rs.ending.sign}</p>
      </div>
      <div class="note reveal"><div class="from">MAINT-04:</div>Session closed.<br><br>
        Filed by <b>${esc(session.name)}</b> at <b>${when}</b>. Show this screen to the host.</div>
    </div>`;
  }

  // ---------------- small things ----------------
  function scrambleTitle(){
    const el = document.getElementById('dt'); if(!el) return;
    const finalText = el.textContent, chars = 'ABCDEFGHJKMNPQRSTUVWXYZ23456789#%&';
    const start = performance.now(), dur = 750;
    (function frame(now){
      const p = Math.min(1, (now - start) / dur), keep = Math.floor(finalText.length * p);
      let s = '';
      for(let i = 0; i < finalText.length; i++){
        const ch = finalText[i];
        s += (i < keep || ch === ' ') ? ch : chars[Math.floor(Math.random() * chars.length)];
      }
      el.textContent = s;
      if(p < 1) requestAnimationFrame(frame); else el.textContent = finalText;
    })(start);
  }

  // four taps on "TBI" wipes this phone's progress -- for testing and resetting between runs
  function wireReset(){
    let taps = 0, last = 0;
    app.querySelectorAll('.logo').forEach(l => l.addEventListener('click', () => {
      const now = Date.now(); taps = (now - last < 2500) ? taps + 1 : 1; last = now;
      if(taps >= 4){ taps = 0;
        openMaint();
      }
    }));
  }

  // ================= UNIT 04 — maintenance (host tools) =================
  let host = null;                                  // decrypted with the host key; memory only, never stored
  function openMaint(){
    let el = document.getElementById('maint');
    if(!el){ el = document.createElement('div'); el.id = 'maint'; document.body.appendChild(el); }
    drawMaint();
  }
  function closeMaint(){ const el = document.getElementById('maint'); if(el) el.remove(); }
  function nextLockedId(){ for(let i = 1; i <= TBI.files; i++) if(!files[i]) return i; return null; }

  function drawMaint(msg){
    const el = document.getElementById('maint');
    let body;
    if(!host){
      body = `
        <label for="hk">Host key</label>
        <div class="row"><input type="text" id="hk" autocapitalize="characters" spellcheck="false" placeholder="HOST-____-____">
          <button class="btn" id="hku">Unlock</button></div>`;
    } else if(!session){
      body = `<p>Host tools unlocked. Sign in as:</p>
        <div class="mgrid"><button class="btn" data-m="in:A">Shift A</button><button class="btn" data-m="in:B">Shift B</button></div>`;
    } else {
      const nx = nextLockedId(), solved = reportState().solved;
      const other = session.team === 'A' ? 'B' : 'A';
      body = `<p>Signed in as <b>${esc(session.name)}</b>. ${Object.keys(files).length} of ${TBI.files} files open.</p>
        <div class="mgrid">
          <button class="btn" data-m="next" ${nx && !solved ? '' : 'disabled'}>${nx ? 'Open file ' + String(nx).padStart(2,'0') : 'All files open'}</button>
          <button class="btn" data-m="all" ${nx && !solved ? '' : 'disabled'}>Open all files</button>
          <button class="btn" data-m="solve">Solve this puzzle</button>
          <button class="btn" data-m="in:${other}">Switch to Shift ${other}</button>
        </div>
        <p class="mans">Report answers: <b>${host.answers.split('').join(' &nbsp;')}</b></p>
        <p class="mans">Puzzle answers: ${Object.keys(host.puzzles).map(k => String(k).padStart(2,'0') + ' = ' + host.puzzles[k]).join(' &middot; ')}</p>`;
    }
    el.innerHTML = `<div class="mbox">
      <div class="mhead">Unit 04 &mdash; maintenance</div>
      <p class="msub">This unit does not exist. Neither do these controls.</p>
      ${body}
      <div class="msg" id="mm">${msg || ''}</div>
      <div class="mfoot"><button class="linkbtn" id="mwipe">Erase this phone&rsquo;s progress</button>
        <button class="linkbtn" id="mclose">Close</button></div></div>`;

    el.querySelector('#mclose').onclick = closeMaint;
    el.querySelector('#mwipe').onclick = () => {
      if(!confirm('Erase all portal progress on this phone?')) return;
      LS.clear(); session = null; viewing = null; host = null; closeMaint(); renderLogin();
    };
    const hku = el.querySelector('#hku');
    if(hku) hku.onclick = async () => {
      hku.disabled = true;
      const got = await unseal(await derive(el.querySelector('#hk').value, TBI.host.salt), TBI.host.bundle);
      hku.disabled = false;
      if(!got){ drawMaint('That isn\u2019t the host key.'); el.querySelector('#mm').className = 'msg bad'; return; }
      host = got; drawMaint();
    };
    el.querySelectorAll('[data-m]').forEach(b => b.onclick = async () => {
      const [cmd, arg] = b.dataset.m.split(':');
      b.disabled = true;
      if(cmd === 'in'){ await signIn(arg, host[arg].access); drawMaint(); return; }
      if(cmd === 'next'){
        const id = nextLockedId();
        const r = await tryUnlock(host[session.team].files[id]);
        justOpened = id; renderPortal(id); drawMaint(r.status === 'new' ? 'Opened file ' + String(id).padStart(2,'0') + '.' : 'Could not open it.');
        return;
      }
      if(cmd === 'solve'){ const id = viewing; if(files[id] && files[id].puzzle){ await trySolve(id, host.puzzles[String(id)]); renderPortal(id); drawMaint('Puzzle solved.'); } else { drawMaint('No puzzle on this file.'); } return; }
      if(cmd === 'all'){
        let n = 0;
        for(let id = 1; id <= TBI.files; id++){
          if(files[id]) continue;
          const r = await tryUnlock(host[session.team].files[id]); if(r.status === 'new') n++;
        }
        for(const k of Object.keys(files)){ if(files[k].puzzle) await trySolve(Number(k), host.puzzles[k]); }
        renderPortal(TBI.files); drawMaint('Opened ' + n + ' file' + (n === 1 ? '' : 's') + ' and solved the puzzles.');
      }
    });
  }

  function esc(s){ return String(s).replace(/[&<>"]/g, c => ({ '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;' }[c])); }
  function stripTags(s){ const d = document.createElement('div'); d.innerHTML = s; return esc(d.textContent); }

  route();
})();
</script>
</body>
</html>
